syntax = "proto2";

package minicyber.proto;

import "minicyber/proto/component_conf.proto";

/**
 * ComponentInfo：事件驱动组件包装信息
 * 作用：绑定组件类名 + 组件运行配置，用于动态创建组件实例
 */
message ComponentInfo {
  optional string class_name = 1;      // 【字段编号1】组件C++类名，dlopen动态加载时用于反射构造对象
  optional ComponentConfig config = 2;  // 【字段编号2】事件驱动组件运行参数（订阅话题、配置文件等）
}

/**
 * TimerComponentInfo：定时器驱动组件包装信息
 */
message TimerComponentInfo {
  optional string class_name = 1;              // 【字段编号1】定时组件C++类名
  optional TimerComponentConfig config = 2;    // 【字段编号2】定时组件运行参数（执行周期、配置文件等）
}

/**
 * ModuleConfig：模块配置
 * 一个模块对应一个 .so 动态库，库内包含若干业务组件
 */
message ModuleConfig {
  optional string module_library = 1;                  // 【字段编号1】动态库文件路径，mainboard通过dlopen加载
  repeated ComponentInfo components = 2;               // 【字段编号2】模块内所有事件驱动组件列表
  repeated TimerComponentInfo timer_components = 3;    // 【字段编号3】模块内所有定时器驱动组件列表
}

/**
 * DagConfig：顶层DAG计算图总配置（整个应用任务清单）
 * mainboard启动时读取该配置，完成全部模块、组件加载与初始化
 */
message DagConfig {
  repeated ModuleConfig module_config = 1;  // 【字段编号1】应用包含的所有模块数组
}